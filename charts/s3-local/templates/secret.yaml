{{- if not .Values.credentials.existingSecret }}
{{- $name := include "s3-local.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKey := randAlphaNum 40 }}
{{- if and $existing $existing.data $existing.data.secretKey }}
{{- $secretKey = b64dec $existing.data.secretKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "s3-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.credentials.accessKey | quote }}
  secretKey: {{ $secretKey | quote }}
{{- end }}
