apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3-local.name" . }}
  labels: {{- include "s3-local.labels" . | nindent 4 }}
spec:
  selector: {{- include "s3-local.labels" . | nindent 4 }}
  ports:
    - {name: s3, port: {{ .Values.service.port }}, targetPort: s3}
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
