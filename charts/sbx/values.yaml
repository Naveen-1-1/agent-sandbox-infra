# Every endpoint, credential, storage class and registry comes from here;
# nothing in the templates assumes kind or a single node.

# sbx's own images. (Not under global: subcharts such as the monitoring
# stack read global.imageRegistry too, and must keep pulling from theirs.)
images:
  # Registry prefix, e.g. localhost:5001 or ghcr.io/org.
  registry: ""
  # Default tag (make deploy sets a content hash).
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  controller: {repository: sbx-controller, tag: ""}
  gateway: {repository: sbx-gateway, tag: ""}
  runtime: {repository: sbx-runtime, tag: ""}
  fixtures: {repository: sbx-fixtures, tag: ""}

controller:
  replicas: 1
  leaderElect: true
  maxConcurrentReconciles: 16
  brokerPort: 9443
  metricsPort: 8080
  healthPort: 8081
  maxBundleBytes: 524288000 # 500 MiB
  presignTTL: 15m
  # At most maxConcurrent wakes and suspends run at once; wakes go first,
  # but minSuspend slots stay open for suspends so a storm still frees capacity.
  ops:
    maxConcurrent: 8
    minSuspend: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# The cluster-wide sleep policy, rendered into the sbx-policy-defaults
# ConfigMap. A sbx-policy ConfigMap (written by the settings page) overrides
# it at runtime and survives upgrades. Policies: fixed, never.
policy:
  name: fixed
  params:
    idleTimeout: 10m
    afterTurnEnded: 2m

gateway:
  replicas: 2
  service:
    type: ClusterIP # NodePort or LoadBalancer to reach it from outside
    port: 80
    nodePort: ""
    annotations: {}
  adminToken:
    existingSecret: "" # Secret with key "token"; empty = generate one
  hold:
    perWorkspace: 256 # requests that may wait for one waking workspace
    global: 4096
    timeout: 90s
  execTimeout: 10m
  # Editors and app ports are served on per-workspace hosts under this
  # domain: <name>.<namespace>.<domain> and <port>.<name>.<namespace>.<domain>.
  # It needs a wildcard DNS record (and, for https, a wildcard certificate)
  # pointing at the gateway. Empty turns editors off.
  domain: ""
  # How browsers reach the gateway, for sign-in links.
  publicScheme: http
  publicPort: 0 # 0: the scheme's default
  sessionTTL: 12h
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# Master key for per-epoch tokens. Empty: generate one and keep it across upgrades.
signing:
  existingSecret: "" # Secret with key "key" (at least 32 bytes)

s3:
  # Empty endpoint with s3local.enabled uses the bundled SeaweedFS service.
  endpoint: ""
  # Address pods use in presigned URLs, if different from endpoint.
  presignEndpoint: ""
  region: us-east-1
  bucket: sbx
  pathStyle: true
  createBucket: true
  # Secret with keys accessKey and secretKey. Empty with s3local.enabled uses its generated Secret.
  existingSecret: ""

# Source repositories.
repositories:
  # Allow repositories on private, loopback or link-local addresses. Off by
  # default so a workspace can't make the controller probe internal services.
  allowPrivateHosts: false

# Defaults for workspace pods.
workspace:
  # Namespace for workspaces created through the gateway.
  namespace: sbx-workspaces
  createNamespace: true
  defaultImage: mcr.microsoft.com/devcontainers/base:trixie
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  storage:
    size: 5Gi
    storageClassName: "" # empty = cluster default
  snapshot:
    exclude: [node_modules, .venv]
    maxFileBytes: 52428800 # 50 MiB
    maxNewBytes: 524288000 # 500 MiB
  # How the workspace container gets the agent and editor: "image" mounts
  # them read-only from the runtime image (an image volume, Kubernetes 1.35+,
  # or 1.33+ with the ImageVolume feature gate); "copy" copies them into
  # every pod, which works anywhere but adds the editor's size to each wake.
  tools: image
  # Dependency directories (node_modules, .venv) are restored from a shared
  # cache keyed by lockfile, image digest and arch, or installed on a miss.
  deps:
    maxArchiveBytes: 2147483648 # 2 GiB; larger installs aren't cached
    waitTimeout: 15m # how long a command that needs them may wait

# Test-only git server for e2e tests and the demo.
fixtures:
  enabled: false

agentSandbox:
  enabled: true
  image:
    tag: v1.0.7
  namespace:
    create: true
    name: agent-sandbox-system

s3local:
  enabled: false

# List prices behind sbx_cost_usd_per_hour. The defaults are on-demand AWS
# us-east-1 prices (Fargate per vCPU and GiB, gp3 volumes, S3 Standard);
# set your own. They show the scale of the saving, not a bill.
pricing:
  cpuCoreHour: 0.04048
  memoryGiBHour: 0.004445
  diskGiBMonth: 0.08
  objectGiBMonth: 0.023
  storageUsageInterval: 5m # how often object storage is listed for its size

# ServiceMonitors for the controller and gateway, and the Grafana dashboards
# (fleet, wake, storage-cost) as ConfigMaps for Grafana's dashboard sidecar.
# They are always rendered with the bundled stack (monitoring.enabled); turn
# them on to use a Prometheus operator and Grafana the cluster already runs.
metrics:
  serviceMonitors: false
  dashboards: false

# kube-prometheus-stack, trimmed to what the dashboards need: Prometheus
# scraping only the platform's ServiceMonitors, and Grafana with the sbx
# dashboards. Alertmanager, node-exporter, kube-state-metrics and the
# Kubernetes component scrapes are off.
monitoring:
  enabled: false
  fullnameOverride: sbx-monitoring
  crds:
    enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
  prometheus:
    prometheusSpec:
      # Pick up ServiceMonitors without the stack's release label.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      scrapeInterval: 15s
      retention: 3d
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 1Gi}
  grafana:
    defaultDashboardsEnabled: false
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
