{{- if not .Values.signing.existingSecret }}
{{- $name := include "sbx.signingSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := randAlphaNum 64 }}
{{- if and $existing $existing.data $existing.data.key }}
{{- $key = b64dec $existing.data.key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "sbx.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # losing the key invalidates every pod token
type: Opaque
stringData:
  key: {{ $key | quote }}
{{- end }}
