apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller
  labels: {{- include "sbx.labels" . | nindent 4 }}
    app.kubernetes.io/name: sbx-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: sbx-controller
  template:
    metadata:
      labels: {{- include "sbx.labels" . | nindent 8 }}
        app.kubernetes.io/name: sbx-controller
      annotations:
        checksum/values: {{ toJson .Values | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-controller
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # lets the controller read the master key Secret
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ include "sbx.image" (dict "root" . "image" .Values.images.controller "name" "controller") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --broker-addr=:{{ .Values.controller.brokerPort }}
            - --metrics-addr=:{{ .Values.controller.metricsPort }}
            - --health-addr=:{{ .Values.controller.healthPort }}
            - --max-bundle-bytes={{ int64 .Values.controller.maxBundleBytes }}
            - --presign-ttl={{ .Values.controller.presignTTL }}
          env:
            - {name: SBX_S3_ENDPOINT, value: {{ include "sbx.s3Endpoint" . | quote }}}
            - {name: SBX_S3_PRESIGN_ENDPOINT, value: {{ .Values.s3.presignEndpoint | quote }}}
            - {name: SBX_S3_REGION, value: {{ .Values.s3.region | quote }}}
            - {name: SBX_S3_BUCKET, value: {{ .Values.s3.bucket | quote }}}
            - {name: SBX_S3_PATH_STYLE, value: {{ .Values.s3.pathStyle | quote }}}
            - {name: SBX_S3_CREATE_BUCKET, value: {{ .Values.s3.createBucket | quote }}}
            - name: SBX_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "sbx.s3Secret" . }}, key: accessKey}}
            - name: SBX_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "sbx.s3Secret" . }}, key: secretKey}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: SBX_LEADER_ELECT, value: {{ .Values.controller.leaderElect | quote }}}
            - {name: SBX_MAX_CONCURRENT_RECONCILES, value: {{ .Values.controller.maxConcurrentReconciles | quote }}}
            - {name: SBX_ALLOW_PRIVATE_REPOS, value: {{ .Values.repositories.allowPrivateHosts | quote }}}
            # Sleep decisions.
            - {name: SBX_GATEWAY_SIGNALS_SERVICE, value: {{ printf "%s-gateway-signals" .Release.Name | quote }}}
            - {name: SBX_OPS_MAX_CONCURRENT, value: {{ .Values.controller.ops.maxConcurrent | quote }}}
            - {name: SBX_OPS_MIN_SUSPEND, value: {{ .Values.controller.ops.minSuspend | quote }}}
            # Workspace pods.
            - {name: SBX_RUNTIME_IMAGE, value: {{ include "sbx.image" (dict "root" . "image" .Values.images.runtime "name" "runtime") | quote }}}
            - {name: SBX_BROKER_ADDR, value: {{ include "sbx.brokerAddr" . | quote }}}
            - {name: SBX_PULL_POLICY, value: {{ .Values.images.pullPolicy | quote }}}
            - {name: SBX_DEFAULT_IMAGE, value: {{ .Values.workspace.defaultImage | quote }}}
            - {name: SBX_TOOLS_MODE, value: {{ .Values.workspace.tools | quote }}}
            # Cost metrics.
            - {name: SBX_PRICE_CPU_CORE_HOUR, value: {{ .Values.pricing.cpuCoreHour | quote }}}
            - {name: SBX_PRICE_MEMORY_GIB_HOUR, value: {{ .Values.pricing.memoryGiBHour | quote }}}
            - {name: SBX_PRICE_DISK_GIB_MONTH, value: {{ .Values.pricing.diskGiBMonth | quote }}}
            - {name: SBX_PRICE_OBJECT_GIB_MONTH, value: {{ .Values.pricing.objectGiBMonth | quote }}}
            - {name: SBX_STORAGE_USAGE_INTERVAL, value: {{ .Values.pricing.storageUsageInterval | quote }}}
            - {name: SBX_RUN_AS_USER, value: {{ .Values.workspace.runAsUser | quote }}}
            - {name: SBX_RUN_AS_GROUP, value: {{ .Values.workspace.runAsGroup | quote }}}
            - {name: SBX_STORAGE_SIZE, value: {{ .Values.workspace.storage.size | quote }}}
            - {name: SBX_STORAGE_CLASS, value: {{ .Values.workspace.storage.storageClassName | quote }}}
            - {name: SBX_WORKSPACE_RESOURCES, value: {{ toJson .Values.workspace.resources | quote }}}
            - {name: SBX_SNAPSHOT_EXCLUDE, value: {{ join "," .Values.workspace.snapshot.exclude | quote }}}
            - {name: SBX_SNAPSHOT_MAX_FILE_BYTES, value: {{ int64 .Values.workspace.snapshot.maxFileBytes | quote }}}
            - {name: SBX_SNAPSHOT_MAX_NEW_BYTES, value: {{ int64 .Values.workspace.snapshot.maxNewBytes | quote }}}
            - {name: SBX_MAX_DEPS_BYTES, value: {{ int64 .Values.workspace.deps.maxArchiveBytes | quote }}}
          ports:
            - {name: broker, containerPort: {{ .Values.controller.brokerPort }}}
            - {name: metrics, containerPort: {{ .Values.controller.metricsPort }}}
            - {name: health, containerPort: {{ .Values.controller.healthPort }}}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: master-key, mountPath: /var/run/sbx/master-key, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: master-key
          secret: {secretName: {{ include "sbx.signingSecret" . }}, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "sbx.labels" . | nindent 4 }}
    app.kubernetes.io/name: sbx-controller
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: sbx-controller
  ports:
    - {name: broker, port: {{ .Values.controller.brokerPort }}, targetPort: broker}
    - {name: metrics, port: {{ .Values.controller.metricsPort }}, targetPort: metrics}
