syntax = "proto3";

package sbx.sidecar.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Naveen-1-1/agent-sandbox-infra/gen/go/sbx/sidecar/v1;sidecarv1";

// SidecarService runs in every workspace pod next to the workload. The
// controller calls it; each call carries the controller's per-epoch token.
service SidecarService {
  // Identify reports which workspace epoch and pod this sidecar serves.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
  // StartSnapshot starts a snapshot attempt, or returns the attempt that
  // already has this attempt_id. The workload must already be frozen.
  rpc StartSnapshot(StartSnapshotRequest) returns (StartSnapshotResponse);
  // GetSnapshot reports an attempt's progress and result.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // WatchProgress streams restore milestones for the wake timeline. Stages
  // already reached are sent first.
  rpc WatchProgress(WatchProgressRequest) returns (stream WatchProgressResponse);
  // StartDeps starts restoring this epoch's dependency directory, from the
  // shared cache or by installing it, or reports the restore already
  // started. The workload keeps running meanwhile.
  rpc StartDeps(StartDepsRequest) returns (StartDepsResponse);
}

message StartDepsRequest {
  int64 epoch = 1;
  // The workload container's image by digest (the pod's imageID). Part of
  // the cache key, since it pins the runtime and package manager.
  string image_id = 2;
}

message StartDepsResponse {
  Deps deps = 1;
}

// Deps is the state of this epoch's dependency restore.
message Deps {
  DepsState state = 1;
  // Profile, for example "npm"; empty when the workspace has none.
  string profile = 2;
  // Cache key.
  string key = 3;
  DepsSource source = 4;
  // Archive bytes downloaded, for a cache hit.
  int64 bytes = 5;
  // Why it failed, or the end of the install's output.
  string message = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  // Hex SHA-256 of the lockfile the directory was built from.
  string lock_sha256 = 9;
  // An archive of an install this sidecar ran has been uploaded.
  bool uploaded = 10;
}

enum DepsState {
  DEPS_STATE_UNSPECIFIED = 0;
  DEPS_STATE_RESTORING = 1;
  DEPS_STATE_INSTALLING = 2;
  DEPS_STATE_READY = 3;
  // Commands that need the dependencies run anyway and report the error.
  DEPS_STATE_FAILED = 4;
}

// DepsSource says where a ready dependency directory came from.
enum DepsSource {
  DEPS_SOURCE_UNSPECIFIED = 0;
  // The workspace has no dependencies we know how to restore.
  DEPS_SOURCE_NONE = 1;
  // The directory was already in the workspace (committed, say).
  DEPS_SOURCE_PRESENT = 2;
  DEPS_SOURCE_CACHE = 3;
  DEPS_SOURCE_INSTALL = 4;
}

// DepsUpload reports what a snapshot did with the dependency directory.
message DepsUpload {
  string key = 1;
  int64 size_bytes = 2;
  bool uploaded = 3;
  // Why nothing was uploaded, for example "cache hit" or "lockfile changed".
  string skipped = 4;
  // An upload failure. It never fails the snapshot.
  string error = 5;
}

message IdentifyRequest {}

message IdentifyResponse {
  string workspace_uid = 1;
  int64 epoch = 2;
  string pod_uid = 3;
  VolumeState volume_state = 4;
}

// VolumeState is the restore state recorded on the workspace disk.
enum VolumeState {
  VOLUME_STATE_UNSPECIFIED = 0;
  // A restore was started and has not finished.
  VOLUME_STATE_RESTORING = 1;
  // Files are restored; the disk holds live user work and is never restored over.
  VOLUME_STATE_LIVE = 2;
}

message StartSnapshotRequest {
  string attempt_id = 1;
  int64 epoch = 2;
  // Stamps the snapshot commits, so a retry produces the same commit IDs.
  google.protobuf.Timestamp freeze_time = 3;
  // Upstream commit whose objects are left out of the bundle.
  string base_sha = 4;
}

message StartSnapshotResponse {
  Snapshot snapshot = 1;
}

message GetSnapshotRequest {
  string attempt_id = 1;
}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

// Snapshot is the state of one snapshot attempt.
message Snapshot {
  string attempt_id = 1;
  SnapshotState state = 2;
  // Commit holding the working tree.
  string wip_sha = 3;
  // Commit holding the staging area.
  string index_sha = 4;
  // Symbolic HEAD, empty if detached.
  string head = 5;
  // S3 key the bundle was uploaded to (content addressed).
  string bundle_key = 6;
  // Hex SHA-256 of the bundle.
  string sha256 = 7;
  int64 size_bytes = 8;
  SnapshotError error = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // Uncompressed size of the files new since the base.
  int64 new_bytes = 12;
  // The dependency cache upload that rode along, if any.
  DepsUpload deps_upload = 13;
}

// SnapshotState is where a snapshot attempt is.
enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_RUNNING = 1;
  SNAPSHOT_STATE_SUCCEEDED = 2;
  SNAPSHOT_STATE_FAILED = 3;
}

// SnapshotError explains a failed attempt. The workspace keeps running.
message SnapshotError {
  SnapshotErrorCode code = 1;
  string message = 2;
  // Offending paths, for secrets and size limits. Never secret values.
  repeated string paths = 3;
}

// SnapshotErrorCode classifies snapshot failures.
enum SnapshotErrorCode {
  SNAPSHOT_ERROR_CODE_UNSPECIFIED = 0;
  // A new file or commit looks like it contains a secret.
  SNAPSHOT_ERROR_CODE_SECRET_DETECTED = 1;
  // A file, the working tree or the bundle is over its size limit.
  SNAPSHOT_ERROR_CODE_TOO_LARGE = 2;
  // The bundle could not be uploaded.
  SNAPSHOT_ERROR_CODE_UPLOAD_FAILED = 3;
  // A git command failed.
  SNAPSHOT_ERROR_CODE_GIT_FAILED = 4;
  SNAPSHOT_ERROR_CODE_INTERNAL = 5;
}

message WatchProgressRequest {}

message WatchProgressResponse {
  Stage stage = 1;
  google.protobuf.Timestamp at = 2;
  string detail = 3;
  // Bytes downloaded for this stage.
  int64 bytes = 4;
}

// Stage is a restore milestone.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  // Workspace files are restored; the workload can start.
  STAGE_FILES_READY = 1;
  // Dependency directories are restored (from cache or a fresh install).
  STAGE_DEPS_READY = 2;
  // Dependency restore failed; commands run without waiting.
  STAGE_DEPS_FAILED = 3;
}
