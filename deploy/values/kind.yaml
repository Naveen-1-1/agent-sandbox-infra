# Local kind cluster: images from the local registry, bundled SeaweedFS and
# the test-only git fixtures server.
global:
  imageRegistry: localhost:5001
s3local:
  enabled: true
fixtures:
  enabled: true
repositories:
  allowPrivateHosts: true # the fixtures git server is in-cluster
gateway:
  service:
    type: NodePort
    nodePort: 30080 # mapped to 127.0.0.1:8080 by deploy/kind/cluster.yaml
  # Browsers resolve every *.localhost name to loopback, so editors need no
  # DNS setup: http://<name>.<namespace>.sbx.localhost:8080/
  domain: sbx.localhost
  publicPort: 8080
